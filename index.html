<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>161AT018 Peter - Home</title>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        .header { width: 100%; height: 200px; background: url("images/header.jpg") no-repeat center center; background-size: 100% 100%; border-bottom: 2px solid #ff9900; margin: 0; display: block; }
        .wrapper { display: flex; flex-wrap: wrap; max-width: 1400px; margin: 20px auto; gap: 20px; padding: 0 20px; }
        .panel, .content { background-color: #1e1e1e; border: 1px solid #333; padding: 25px; box-sizing: border-box; }
        .panel { flex: 0 1 250px; }
        .content { flex: 1 1 800px; min-width: 350px; }
        .menu a { display: block; color: #bbb; text-decoration: none; padding: 12px 10px; border-bottom: 1px solid #2a2a2a; transition: 0.3s; }
        .menu a:hover { color: #fff; background: #2a2a2a; border-left: 4px solid #ff9900; }
        h1 { color: #ff9900; border-bottom: 2px solid #ff9900; padding-bottom: 10px; margin-top: 0; }
        .clock-container { text-align: center; }
        .clock-label { color: #ff9900; font-weight: bold; font-size: 14px; text-transform: uppercase; }
        .time-local { font-size: 1.8em; font-weight: bold; color: #ff9900; font-family: "Courier New", monospace; }
        .time-utc { font-size: 1.8em; font-weight: bold; color: #0080ff; font-family: "Courier New", monospace; }
        .divider { border-top: 1px solid #333; margin: 20px 0; }
        @media (max-width: 850px) { .wrapper { flex-direction: column; } .header { height: 120px; } }
    </style>
</head>
<body onload="updateTime()">
    <div class="header"></div>
    <div class="wrapper">
        <aside class="panel">
            <div style="color:#ff9900; font-weight:bold; border-bottom:1px solid #444; margin-bottom:10px;">NAVIGATION</div>
            <nav class="menu">
                <a href="index.html">Home</a><a href="qth.html">My QTH</a><a href="equipment.html">My Equipment</a><a href="qsl.html">QSL info</a><a href="gallery.html">QSL Gallery</a><a href="prefix.html">11m Prefix List</a><a href="video.html">Video & Stream</a><a href="links.html">Links</a><a href="contact.html">Contact</a>
            </nav>
        </aside>
        <main class="content">
            <h1>Welcome to 161AT018 Peter's Website</h1>
            <p>Hello! I am Peter, a radio operator from Poland and a proud member of the Alfa Tango International Group.</p>
            <div style="text-align: center; margin-top: 30px;">
                <img src="images/at_logo.png" alt="Alfa Tango Logo" style="max-width: 250px;">
            </div>
        </main>
        <aside class="panel">
            <div class="clock-container">
                <div class="clock-label">Local Time (PL)</div>
                <div id="clock" class="time-local">00:00:00</div>
                <div class="divider"></div>
                <div class="clock-label">UTC Time</div>
                <div id="utc_clock" class="time-utc">00:00:00</div>
            </div>
        </aside>
    </div>
    <script>
        function updateTime() {
            const localOpts = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false, timeZone: 'Europe/Warsaw' };
            const utcOpts = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false, timeZone: 'UTC' };
            setInterval(() => {
                const now = new Date();
                document.getElementById('clock').textContent = now.toLocaleTimeString('en-GB', localOpts);
                document.getElementById('utc_clock').textContent = now.toLocaleTimeString('en-GB', utcOpts);
            }, 1000);
        }
    </script>
</body>
</html>
